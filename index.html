<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PV Jobs India</title>
<style>
  :root{
    --ink:#152238;
    --ink-soft:#5b6b82;
    --bg:#f3f6f5;
    --card:#ffffff;
    --line:#e3e8f0;
    --teal:#0f766e;
    --teal-deep:#0b4f49;
    --teal-soft:#e6f4f2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
  }

  header{
    background:linear-gradient(135deg,#0f766e,#0b4f49);
    color:#fff; padding:36px 24px 30px;
  }
  .header-inner{max-width:1100px; margin:0 auto; display:flex; align-items:flex-start; gap:16px;}
  .mark{
    width:46px; height:46px; border-radius:12px; background:rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;
  }
  .mark svg{width:24px; height:24px;}
  header h1{margin:0 0 6px; font-size:1.7rem; font-weight:700; letter-spacing:-0.01em;}
  header p{margin:0; opacity:.88; font-size:.98rem; max-width:520px; line-height:1.5;}
  .updated{font-size:.78rem; opacity:.7; margin-top:10px;}

  .wrap{max-width:1100px; margin:0 auto; padding:20px 20px 60px;}

  .filters{
    display:flex; flex-wrap:wrap; gap:10px; background:var(--card);
    padding:16px; border-radius:14px; border:1px solid var(--line);
    margin:-26px auto 24px; position:relative; box-shadow:0 8px 20px rgba(15,40,35,.08);
  }
  .filters input, .filters select{
    padding:10px 13px; border-radius:9px; border:1px solid var(--line);
    font-size:.9rem; color:var(--ink); background:#fff;
  }
  .filters input:focus, .filters select:focus{
    outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft);
  }
  .filters input{flex:1; min-width:180px;}

  .count{font-size:.9rem; color:var(--ink-soft); margin-bottom:14px;}

  .grid{display:grid; gap:12px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--ink-soft);
    border-radius:10px; padding:16px 18px; display:flex; flex-direction:column; gap:8px;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .card:hover{box-shadow:0 6px 18px rgba(15,40,35,.08); transform:translateY(-1px);}

  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .title{font-size:1.05rem; font-weight:600; margin:0;}
  .company{color:var(--teal); font-weight:600; font-size:.85rem; text-transform:uppercase; letter-spacing:.03em;}
  .meta{display:flex; flex-wrap:wrap; gap:12px; font-size:.82rem; color:var(--ink-soft);}
  .meta span{display:inline-flex; align-items:center; gap:4px;}

  .tags{display:flex; gap:6px; flex-wrap:wrap; align-items:flex-start;}
  .tag{
    padding:3px 11px; border-radius:999px; font-size:.72rem; font-weight:700;
    text-transform:uppercase; letter-spacing:.02em; white-space:nowrap;
  }
  .tag-exp{background:#eef1f5; color:var(--ink-soft); font-weight:600;}
  .tag-type{background:#f1f5f9; color:#334155; font-weight:600;}

  .apply{
    align-self:flex-start; margin-top:4px; text-decoration:none;
    background:var(--teal); color:#fff; padding:9px 18px; border-radius:8px;
    font-size:.85rem; font-weight:600; transition:background .15s ease;
  }
  .apply:hover{background:var(--teal-deep);}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
    background:var(--card); border:1px dashed var(--line); border-radius:12px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 L20 5.5 V11 C20 16 16.5 19.5 12 21 C7.5 19.5 4 16 4 11 V5.5 Z"/>
        <path d="M7 12 L9.5 12 L11 8.5 L13 15 L14.5 11 L16 12 L17.5 12"/>
      </svg>
    </div>
    <div>
      <h1>PV Jobs India</h1>
      <p>Pharmacovigilance &amp; pharma-domain jobs, pulled directly from company career pages — every link is real.</p>
      <div class="updated" id="updated"></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="filters">
    <input type="text" id="searchBox" placeholder="Search title or company...">
    <select id="categoryFilter">
      <option value="">All departments</option>
      <option value="Pharmacovigilance">Pharmacovigilance</option>
      <option value="Signal Detection">Signal Detection</option>
      <option value="Risk Management">Risk Management</option>
      <option value="Regulatory Affairs">Regulatory Affairs</option>
      <option value="Clinical Operations">Clinical Operations</option>
      <option value="TMF / Document Mgmt">TMF / Document Mgmt</option>
      <option value="Medical Writing & QA">Medical Writing &amp; QA</option>
      <option value="IT / Systems / Analyst">IT / Systems / Analyst</option>
      <option value="Other">Other</option>
    </select>
    <select id="experienceFilter">
      <option value="">All experience levels</option>
      <option value="Entry-level">Entry-level</option>
      <option value="Mid-level">Mid-level</option>
      <option value="Senior">Senior</option>
      <option value="Leadership (Manager+)">Leadership (Manager+)</option>
      <option value="Not specified">Not specified</option>
    </select>
    <select id="typeFilter">
      <option value="">All company types</option>
    </select>
    <select id="companyFilter">
      <option value="">All companies</option>
    </select>
    <select id="locationFilter">
      <option value="">All locations</option>
    </select>
  </div>

  <div class="count" id="resultCount"></div>
  <div class="grid" id="jobGrid"></div>
</div>

<script>
let allJobs = [];

// One color per department — used for the card's left-edge stripe and the tag pill.
const CATEGORY_STYLES = {
  "Pharmacovigilance":      { border:"#0f766e", bg:"#e6f4f2", fg:"#0b4f49" },
  "Signal Detection":       { border:"#5b4bb8", bg:"#eeecfb", fg:"#3f3486" },
  "Risk Management":        { border:"#a13a5c", bg:"#fbecf1", fg:"#7a2c46" },
  "Regulatory Affairs":     { border:"#b45309", bg:"#fdf1e0", fg:"#8a3f05" },
  "Clinical Operations":    { border:"#1d4ed8", bg:"#e8edfc", fg:"#1e3a8a" },
  "TMF / Document Mgmt":    { border:"#475569", bg:"#eef1f5", fg:"#334155" },
  "Medical Writing & QA":   { border:"#15803d", bg:"#e7f5ea", fg:"#14532d" },
  "IT / Systems / Analyst": { border:"#6b7280", bg:"#f1f2f4", fg:"#374151" },
  "Other":                  { border:"#94a3b8", bg:"#f1f5f9", fg:"#475569" }
};

function styleFor(cat){
  return CATEGORY_STYLES[cat] || CATEGORY_STYLES["Other"];
}

async function loadJobs(){
  try{
    const res = await fetch('jobs.json?_=' + Date.now());
    const data = await res.json();
    allJobs = data.jobs || [];
    document.getElementById('updated').textContent =
      'Last updated: ' + new Date(data.generated_at).toLocaleString();
    populateFilterOptions();
    render();
  }catch(e){
    document.getElementById('jobGrid').innerHTML =
      '<div class="empty">No jobs.json found yet. Run scraper.py first to pull live jobs.</div>';
  }
}

function populateFilterOptions(){
  const companies = [...new Set(allJobs.map(j => j.company))].sort();
  const locations = [...new Set(allJobs.map(j => j.location).filter(Boolean))].sort();
  const types = [...new Set(allJobs.map(j => j.type).filter(Boolean))].sort();

  const companySelect = document.getElementById('companyFilter');
  companies.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    companySelect.appendChild(opt);
  });

  const locationSelect = document.getElementById('locationFilter');
  locations.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    locationSelect.appendChild(opt);
  });

  const typeSelect = document.getElementById('typeFilter');
  types.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    typeSelect.appendChild(opt);
  });
}

function render(){
  const search = document.getElementById('searchBox').value.toLowerCase();
  const category = document.getElementById('categoryFilter').value;
  const experience = document.getElementById('experienceFilter').value;
  const type = document.getElementById('typeFilter').value;
  const company = document.getElementById('companyFilter').value;
  const location = document.getElementById('locationFilter').value;

  let filtered = allJobs.filter(j => {
    if(category && j.category !== category) return false;
    if(experience && j.experience_level !== experience) return false;
    if(type && j.type !== type) return false;
    if(company && j.company !== company) return false;
    if(location && j.location !== location) return false;
    if(search && !(j.title.toLowerCase().includes(search) || j.company.toLowerCase().includes(search))) return false;
    return true;
  });

  // Most recently posted first
  filtered.sort((a,b) => new Date(b.posted_on_parsed || 0) - new Date(a.posted_on_parsed || 0));

  document.getElementById('resultCount').textContent =
    filtered.length + ' job' + (filtered.length === 1 ? '' : 's') + ' found';

  const grid = document.getElementById('jobGrid');
  if(filtered.length === 0){
    grid.innerHTML = '<div class="empty">No jobs match your filters right now.</div>';
    return;
  }

  grid.innerHTML = filtered.map(j => {
    const s = styleFor(j.category);
    return `
    <div class="card" style="border-left-color:${s.border};">
      <div class="card-top">
        <div>
          <div class="company">${j.company}</div>
          <h3 class="title">${j.title}</h3>
        </div>
        <div class="tags">
          <span class="tag" style="background:${s.bg}; color:${s.fg};">${j.category}</span>
          ${j.experience_level ? `<span class="tag tag-exp">${j.experience_level}</span>` : ''}
          ${j.type ? `<span class="tag tag-type">${j.type}</span>` : ''}
        </div>
      </div>
      <div class="meta">
        <span>📍 ${j.location || 'Location not specified'}</span>
        <span>🗓️ ${j.posted_on || 'Date not specified'}</span>
        ${j.req_id ? `<span>🔖 ${j.req_id}</span>` : ''}
      </div>
      <a class="apply" href="${j.apply_url}" target="_blank" rel="noopener">Apply on company site →</a>
    </div>
  `;
  }).join('');
}

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('categoryFilter').addEventListener('change', render);
document.getElementById('experienceFilter').addEventListener('change', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('companyFilter').addEventListener('change', render);
document.getElementById('locationFilter').addEventListener('change', render);

loadJobs();
</script>

</body>
</html>
